<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>HumToKeys</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="room-app">
      <div id="roomScene" class="room-scene" aria-label="Interactive 3D HumToKeys music room"></div>

      <header class="room-mark" aria-label="HumToKeys">
        <p>HumToKeys</p>
        <span id="statusPill">Room ready</span>
      </header>

      <div class="room-readout" aria-live="polite">
        <strong id="currentNote">--</strong>
        <span id="frequencyReadout">Find the record painting to begin.</span>
      </div>

      <div class="visually-hidden" aria-live="polite">
        <button id="recordButton" type="button">Record</button>
        <button id="stopButton" type="button" disabled>Stop</button>
        <button id="demoButton" type="button">Load demo</button>
        <button id="clearButton" type="button">Clear</button>
        <input id="naturalOnlyToggle" type="checkbox" />
        <button id="viewScoreButton" type="button" disabled>View score</button>
        <button id="exportButton" type="button" disabled>Save PDF</button>
        <button id="playButton" type="button" disabled>Play on piano</button>
        <span id="levelBar"></span>
        <span id="noteCount">0</span>
        <span id="durationReadout">0.0s</span>
        <ol id="noteTrail"></ol>
      </div>

      <svg id="sheetSvg" class="visually-hidden" viewBox="0 0 980 330" role="img" aria-label="Generated music sheet"></svg>

      <dialog id="scoreDialog" class="score-dialog" aria-labelledby="scoreDialogTitle">
        <div class="dialog-shell">
          <div class="dialog-heading">
            <div>
              <p class="eyebrow">Full score</p>
              <h2 id="scoreDialogTitle">Your melody</h2>
            </div>
            <div class="dialog-actions">
              <button id="dialogExportButton" class="secondary-button" type="button">Save PDF</button>
              <button id="closeScoreButton" class="ghost-button" type="button">Close</button>
            </div>
          </div>
          <div class="full-sheet-wrap">
            <svg id="fullSheetSvg" viewBox="0 0 980 330" role="img" aria-label="Full generated music sheet"></svg>
          </div>
        </div>
      </dialog>
    </main>

    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.161.0/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.161.0/examples/jsm/"
        }
      }
    </script>
    <script type="module" src="app.js"></script>
  </body>
</html>
